name: Validate skill package
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check files and compile helper
        run: |
          test -f SKILL.md
          test -f lovable-personal-skill.md
          python -m py_compile scripts/check_project.py
          python scripts/check_project.py . --output /tmp/securebuild-report.json
